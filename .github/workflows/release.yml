name: release

# Builds libpelicanclient release archives and attaches them to the GitHub
# release when a v* tag is pushed.
#
# Linux builds run inside an AlmaLinux 8 container so the resulting
# library links against glibc 2.28 — the compatibility floor.  A cgo
# c-shared library cannot be cross-compiled with CGO_ENABLED=0 tricks, so
# each (os, arch) pair builds natively on a matching runner.
#
# A manual run (workflow_dispatch) builds and uploads the archives as
# workflow artifacts WITHOUT publishing a release, so the build can be
# exercised without cutting a tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its assets

jobs:
  build-linux:
    name: Build (linux/${{ matrix.arch }}, glibc 2.28)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      # glibc 2.28: covers EL8+, Debian 10+, Ubuntu 20.04+ (and 18.10).
      image: almalinux:8
    steps:
      - name: Install build tooling
        run: dnf install -y gcc make git tar gzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: ./scripts/package-release.sh linux ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libpelicanclient-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build (darwin/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: ./scripts/package-release.sh darwin ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libpelicanclient-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libpelicanclient-all
          path: dist/*
          if-no-files-found: error

      # Only on a v* tag: create the GitHub release (if absent) and attach
      # the archives and checksums.  Idempotent: --clobber replaces assets
      # so re-runs are safe.  A pre-release suffix (v1.0.0-rc1) marks the
      # release as a pre-release.
      - name: Publish release with archives
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease_flag=""
          case "$tag" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes $prerelease_flag
          fi
          gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
