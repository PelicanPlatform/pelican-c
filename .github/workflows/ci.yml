name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build & smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: |
          test -z "$(gofmt -l .)"
          go vet -tags=integration ./...

      - name: Build library, examples, and integration driver
        run: make example integration-client

      - name: Offline smoke test
        run: make test

      # Install into a scratch prefix and build a consumer using only
      # pkg-config output, so the installed layout and metadata are
      # exercised rather than just written.
      - name: Install and consume via pkg-config
        run: |
          set -euo pipefail
          prefix="$PWD/installtest"
          make install PREFIX="$prefix"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists libpelicanclient
          cat > /tmp/pcprobe.c <<'EOF'
          #include <stdio.h>
          #include <pelican/client.h>
          int main(void) { printf("%s\n", pelican_version()); return 0; }
          EOF
          cc -o /tmp/pcprobe /tmp/pcprobe.c $(pkg-config --cflags --libs libpelicanclient)
          /tmp/pcprobe
          make uninstall PREFIX="$prefix"

  # Launches a full in-process Pelican federation using the pure-Go
  # serving paths (posixv2 origin, V2 cache), so no XRootD installation
  # is needed, and drives the compiled C library against it.  TLS is
  # fully verified against the federation's generated CA.
  integration:
    name: Federation integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build integration driver
        run: make integration-client

      - name: Run federation integration test
        run: make integration-test
